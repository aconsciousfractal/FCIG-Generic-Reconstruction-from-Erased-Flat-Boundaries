name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q scripts tests
      - name: Focused compatibility tests
        run: python -m unittest discover -s tests

  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Closed-tree manifest
        run: python scripts/check_manifest.py --closed-tree
      - name: Focused tests
        run: python -m unittest discover -s tests
      - name: Exact replay
        run: python scripts/verify_all.py
      - name: Optimized exact replay
        run: python -O scripts/verify_all.py
      - name: Attestation anchor
        run: python scripts/check_attestation.py
      - name: Isolated manifest-only replay
        run: python scripts/verify_manifest_only.py
